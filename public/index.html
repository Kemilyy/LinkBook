                <ul class="links white">
                    <li class="nav-item"><a class="nav-link px-2" href="#">Favoritos</a></li>

                    <li class="nav-item"><a class="nav-link px-2" href="#">Livros Avaliados</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid">
        <section id="lista-editoras" class="livros col-12 d-flex flex-wrap justify-content-center">
        </section>
    </main>

        <a href="#" class="foot">Descubra mais:</a>
