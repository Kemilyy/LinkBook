<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Detalhes da Editora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="detalhe">
    <header class="container-fluid">
        <div class="row align-items-center w-100 flex-nowrap gap-3 px-3">

            <div class="col-auto">
                <div class="logo">
                    <span class="icone_logo">
                        <img src="../public/images/icones/logo.png" alt="Logo">
                    </span>
                </div>
            </div>

            <div class="col-6 mx-auto">
                <form class="busca">
                    <input type="text" placeholder="O que você está procurando?" class="busca_input">
                    <button type="submit" class="busca_lupa">
                        <img src="../public/images/icones/lupa.png" alt="lupa" class="lupa">
                    </button>
                </form>
            </div>

            <!--<div class="not">
            <button type=""submit>
                <img src="../public/images/notificação.png" alt="notificações">
            </button>
            </div>-->

            <div class="col-auto ms-auto">
                <div class="usuario_entrar">
                    <span class="icone_boneco">
                        <img src="../public/images/icones/user (1).png" alt="usuário">
                    </span>
                    <span class="texto_entrar">Entrar</span>
                </div>
            </div>

        </div>
    </header>

    <nav class="container-fluid justify-content-between">
        <div class="row w-100 justify-content-center">
            <div class="">
                <button class="hamburguer">
                    <img src="../public/images/icones/hamburguer.png" alt="menu hamburguer">
                </button>
                <ul class="links white">
                    <li class="nav-item"><a class="nav-link px-2" href="#">Favoritos</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="#">Leituras Futuras</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="#">Chat</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="#">Sugestões</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="#">Livros Avaliados</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div id="detalhe-item"></div>
    </main>

    <footer>...</footer>

    <script src="app.js"></script>
</body>
</html>
