<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Editoras</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cadastro_editoras.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="principal">

    <header class="container-fluid">
        <div class="row align-items-center w-100 flex-nowrap gap-3 px-3">
            <div class="col-auto">
                <div class="logo">
                    <span class="icone_logo">
                        <img src="../images/icones/logo.png" alt="Logo">
                    </span>
                </div>
            </div>
            <div class="col-6 mx-auto">
                <form class="busca">
                    <input type="text" placeholder="O que você está procurando?" class="busca_input">
                    <button type="submit" class="busca_lupa">
                        <img src="../images/icones/lupa.png" alt="lupa" class="lupa">
                    </button>
                </form>
            </div>
            <div class="col-auto ms-auto">
                <div class="usuario_entrar">
                    <span class="icone_boneco">
                        <img src="../images/icones/user (1).png" alt="usuário">
                    </span>
                    <span class="texto_entrar">Entrar</span>
                </div>
            </div>
        </div>
    </header>

    <nav class="container-fluid justify-content-between">
        <div class="row w-100 justify-content-center">
            <div>
                <button class="hamburguer">
                    <img src="../images/icones/hamburguer.png" alt="menu hamburguer">
                </button>
                <ul class="links white">
                    <li class="nav-item"><a class="nav-link px-2" href="index.html">Início</a></li>
                    <!-- Só aparece para admin — controlado pelo JS -->
                    <li class="nav-item link-cadastro" style="display:none">
                        <a class="nav-link px-2" href="cadastro_editoras.html">Cadastro</a>
                    </li>
                    <li class="nav-item link-favoritos"><a class="nav-link px-2" href="favoritos.html">Favoritos</a>
                    </li>
                    <li class="nav-item"><a class="nav-link px-2" href="#">Leituras Futuras</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="#">Chat</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="#">Sugestões</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="#">Livros Avaliados</a></li>
                    <li class="nav-item"><a class="nav-link px-2" href="visualizacao.html">Dados</a></li>
                    <li class="nav-item link-login"><a class="nav-link px-2" href="login.html">Login</a></li>
                    <li class="nav-item link-logout"><a class="nav-link px-2" href="#" onclick="logout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">

        <div id="acesso-negado" style="display:none" class="acesso-negado">
            <h2>Acesso Restrito</h2>
            <p>Esta página é exclusiva para administradores.</p>
            <a href="index.html" class="btn-voltar">← Voltar para o início</a>
        </div>

        <div id="area-admin" style="display:none">

            <div class="form-cadastro">
                <h2 id="titulo-form">Cadastrar Nova Editora</h2>
                <input type="hidden" id="editora-id">

                <label for="nome">Nome da Editora *</label>
                <input type="text" id="nome" placeholder="Ex: Companhia das Letras">

                <label for="imagem">URL da Imagem (logo) *</label>
                <input type="text" id="imagem" placeholder="Ex: ../images/editoras/minhaeditora.png">

                <label for="anoFundacao">Ano de Fundação *</label>
                <input type="text" id="anoFundacao" placeholder="Ex: 1985">

                <label for="sede">Sede *</label>
                <input type="text" id="sede" placeholder="Ex: São Paulo, SP">

                <label for="grupoEditorial">Grupo Editorial</label>
                <input type="text" id="grupoEditorial" placeholder="Ex: Grupo Penguin Random House">

                <label for="generoPrincipal">Gênero Principal</label>
                <input type="text" id="generoPrincipal" placeholder="Ex: Ficção, Romance, Terror">

                <label for="principaisAutores">Principais Autores</label>
                <input type="text" id="principaisAutores" placeholder="Ex: Autor A, Autor B">

                <label for="bio">Biografia / Descrição *</label>
                <textarea id="bio" rows="4" placeholder="Fale sobre a história e identidade da editora..."></textarea>

                <div class="botoes-form">
                    <button class="btn-cadastrar" id="btn-salvar" onclick="salvarEditora()">Cadastrar Editora</button>
                    <button class="btn-cancelar" id="btn-cancelar" style="display:none"
                        onclick="cancelarEdicao()">Cancelar</button>
                </div>

                <div id="mensagem-sucesso"></div>
            </div>

            <div class="secao-lista">
                <h2>Editoras Cadastradas</h2>
                <div id="lista-editoras" class="lista-editoras">
                </div>
            </div>

        </div>
    </main>

    <footer>
        <a href="#" class="foot">Descubra mais:</a>
    </footer>

    <script src="login.js"></script>
    <script src="cadastro_editoras.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
